[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tavessa-backend"
version = "0.1.0"
description = "Tavessa restaurant management platform — FastAPI backend (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "httpx2>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
